<svg xmlns="http://www.w3.org/2000/svg" width="400" height="120" viewBox="0 0 400 120" role="img" aria-labelledby="title"><title id="title">Uptoskills logo</title>
  <defs>
    <linearGradient id="g1" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#ff7a2e"/>
      <stop offset="1" stop-color="#ff4e2e"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#14c8a1"/>
      <stop offset="1" stop-color="#00bfa5"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="transparent"/>
  <!-- Left mortar cap icon -->
  <g transform="translate(12,18) scale(0.9)">
    <polygon points="0,30 60,12 120,30 60,48" fill="#111" />
    <rect x="56" y="44" width="8" height="38" fill="#111" rx="2" />
    <circle cx="118" cy="32" r="4" fill="#111" />
  </g>
  <!-- Text -->
  <g transform="translate(100,80)">
    <text x="0" y="0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="800" font-size="34">
      <tspan fill="url(#g1)">UPTO</tspan>
      <tspan fill="url(#g2)" dx="8">SKILLS</tspan>
    </text>
  </g>
</svg>